name: event-driven-orders

# Only the infrastructure runs here for now.
# The two outbox pollers are separate processes (design §5.4) and are added
# when the outbox tables exist.
# Each poller is a strict singleton: never set `replicas` or scale it,
# because concurrent pollers break per-order publish ordering.

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: event_driven_orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d event_driven_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      # Two listeners: containers reach the broker as redpanda:9092,
      # the host reaches it as localhost:19092 (see --advertise-kafka-addr).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      # Topics are created explicitly with their partition count (design §6.2);
      # auto-creation stays off so a 1-partition topic cannot appear silently.
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  inventory-worker:
    build:
      context: .
      dockerfile: services/inventory-worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redpanda-data:
