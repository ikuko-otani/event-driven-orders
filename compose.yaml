name: event-driven-orders

# Only the infrastructure runs here for now.
# The two outbox pollers are separate processes (design §5.4) and are added
# when the outbox tables exist.
# Each poller is a strict singleton: never set `replicas` or scale it,
# because concurrent pollers break per-order publish ordering.

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: event_driven_orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d event_driven_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      # Two listeners: containers reach the broker as redpanda:9092,
      # the host reaches it as localhost:19092 (see --advertise-kafka-addr).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      # Topics are created explicitly with their partition count (design §6.2);
      # auto-creation stays off so a 1-partition topic cannot appear silently.
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:v26.1.14
    depends_on:
      redpanda:
        condition: service_healthy
    # Topics are created here with the partition count design §6.2 fixes.
    # Auto-creation would make a 1-partition topic instead, and raising the
    # count later changes the key -> partition mapping, which breaks the
    # per-order ordering of §4.2. --if-not-exists keeps a repeated `up`
    # from failing and blocking the poller that waits on this.
    entrypoint:
      - rpk
      - topic
      - create
      - orders.events
      - -p
      - "12"
      - --if-not-exists
      - -X
      - brokers=redpanda:9092

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  order-api-poller:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    # The same image as `api`, running a different process: the poller is a
    # process of its own by design (§5.4) and a strict singleton. Never add
    # `replicas` here — two pollers publish one order's events out of order.
    command:
      - uv
      - run
      - --no-sync
      - --package
      - order-api
      - python
      - -m
      - order_api.poller
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  inventory-worker:
    build:
      context: .
      dockerfile: services/inventory-worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redpanda-data:
