name: event-driven-orders

# Each outbox poller is a process of its own (design §5.4) and a strict
# singleton: never set `replicas` or scale one, because two pollers publish
# one order's events out of order.

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: event_driven_orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d event_driven_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      # Two listeners: containers reach the broker as redpanda:9092,
      # the host reaches it as localhost:19092 (see --advertise-kafka-addr).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      # Topics are created explicitly with their partition count (design §6.2);
      # auto-creation stays off so a 1-partition topic cannot appear silently.
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:v26.1.14
    depends_on:
      redpanda:
        condition: service_healthy
    # Topics are created here with the partition count design §6.2 fixes.
    # Auto-creation would make a 1-partition topic instead, and raising the
    # count later changes the key -> partition mapping, which breaks the
    # per-order ordering of §4.2. --if-not-exists keeps a repeated `up`
    # from failing and blocking the poller that waits on this.
    #
    # The dead-letter topics are a second command because their settings differ
    # (design §5.6): 14-day retention, so a message cannot expire while an
    # incident is still being worked, and one partition, since re-injection
    # republishes to the original topic and DLQ order is only ever read by hand.
    entrypoint:
      - /bin/sh
      - -c
      - |
        rpk topic create orders.events inventory.events \
          -p 12 --if-not-exists -X brokers=redpanda:9092 &&
        rpk topic create orders.events.inventory-worker.dlq inventory.events.order-api.dlq \
          -p 1 -c retention.ms=1209600000 --if-not-exists -X brokers=redpanda:9092

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    # No healthcheck, and nothing below depends on this one: tracing is
    # observability, never a load-bearing dependency (design §2). A process
    # must start and keep working even if Jaeger is slow to come up or is not
    # running at all — the exporter just has nothing to send to yet.
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP receiver

  migrate-orders:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    # Applies the orders history and exits, so nothing that writes to that
    # schema can start before the schema exists. poethepoet is a dev
    # dependency and is not in the image, so alembic is called directly.
    command:
      - uv
      - run
      - --no-sync
      - --package
      - order-api
      - alembic
      - -c
      - services/order-api/alembic.ini
      - upgrade
      - head
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  migrate-inventory:
    build:
      context: .
      dockerfile: services/inventory-worker/Dockerfile
    # A second one-shot, not a second command in the first: each image is
    # synced with --package, so the api image has no inventory_worker package
    # for this history's env.py to import (design §6.1: one history per service).
    command:
      - uv
      - run
      - --no-sync
      - --package
      - inventory-worker
      - alembic
      - -c
      - services/inventory-worker/alembic.ini
      - upgrade
      - head
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  order-api-poller:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    # The same image as `api`, running a different process: the poller is a
    # process of its own by design (§5.4) and a strict singleton. Never add
    # `replicas` here — two pollers publish one order's events out of order.
    command:
      - uv
      - run
      - --no-sync
      - --package
      - order-api
      - python
      - -m
      - order_api.poller
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  order-api-consumer:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    # The same image as `api`, running a different process: an HTTP server and
    # a consumer scale by different rules, so they are never one process.
    # No healthcheck on purpose — "the process is running" reports healthy
    # while the consumer sits disconnected, consuming nothing (design §6.4).
    command:
      - uv
      - run
      - --no-sync
      - --package
      - order-api
      - python
      - -m
      - order_api.consumer
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  inventory-worker:
    build:
      context: .
      dockerfile: services/inventory-worker/Dockerfile
    # No healthcheck on purpose: "the process is running" would report healthy
    # while the consumer sits disconnected from the broker, consuming nothing.
    # Consumer lag is the signal that means anything here (design §6.4).
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  inventory-worker-poller:
    build:
      context: .
      dockerfile: services/inventory-worker/Dockerfile
    # The same image as inventory-worker, running a different process: the
    # poller is a process of its own by design (§5.4) and a strict singleton.
    command:
      - uv
      - run
      - --no-sync
      - --package
      - inventory-worker
      - python
      - -m
      - inventory_worker.poller
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redpanda-data:
