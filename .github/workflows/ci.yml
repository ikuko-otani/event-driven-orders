name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.9"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen
      - run: uv run poe ci
