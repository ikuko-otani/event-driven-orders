name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.9"
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      # --locked, not --frozen: a uv.lock that no longer matches pyproject.toml
      # fails the build here instead of being installed as it stands.
      - run: uv sync --locked
      - run: uv run poe ci
  # A job of its own, not extra steps on `check`: this one builds images and
  # starts the whole stack, so it costs minutes where the unit checks cost
  # about one. In parallel, a failure in either stays readable on its own.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.9"
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      # The seed and the smoke run from the host: both import the two service
      # packages, and no single image contains both.
      - run: uv sync --locked
      # A step of its own, so build time and start-up time are two numbers.
      - run: docker compose build
      # --wait returns once every service is running or healthy, and does not
      # count a one-shot that exited 0 as a failure. It says nothing about the
      # consumers having reached the broker; the smoke's own wait covers that.
      - run: docker compose up -d --wait --wait-timeout 180
      - run: uv run poe seed
      - run: uv run poe smoke
      # Nothing here can be reproduced once the runner is gone, so dump enough
      # to diagnose in place. `ps -a` includes the one-shots, which `ps` hides
      # after they have exited.
      - if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=50
  # A third job, and the only one without Python. Nothing in it reaches AWS,
  # so it passes the same way whether or not anything is deployed.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
      # Reports a diff and fails, never rewrites: the same split as format-check.
      - run: terraform -chdir=infra/terraform fmt -check
      # -backend=false downloads the provider and nothing else; -lockfile=readonly
      # fails on a lock file that no longer matches, as uv sync --locked does.
      - run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly
      # Syntax and references between resources; no credentials needed.
      - run: terraform -chdir=infra/terraform validate
