[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pip-audit>=2.10.1",
    "poethepoet>=0.29",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[kafka,postgres,redis]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["common", "inventory_worker", "order_api"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["libs", "scripts", "services", "tests"]
exclude = ["(^|/)alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy"
test = "pytest"
migrate-orders = "alembic -c services/order-api/alembic.ini upgrade head"
migrate-inventory = "alembic -c services/inventory-worker/alembic.ini upgrade head"
migrate = ["migrate-orders", "migrate-inventory"]
seed = "python scripts/seed.py"
smoke = "python scripts/smoke.py"
check = ["format", "lint", "typecheck", "test"]
ci = ["format-check", "lint", "typecheck", "test"]
