[project]
name = "common"
version = "0.1.0"
description = "Shared configuration and event-envelope helpers"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
