[project]
name = "inventory-worker"
version = "0.1.0"
description = "Kafka consumer for inventory reservation"
requires-python = ">=3.12"
dependencies = ["common"]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_worker"]
