[alembic]
# %(here)s resolves relative to this file, so the task runs from any directory.
script_location = %(here)s/alembic
path_separator = os
# sqlalchemy.url is deliberately absent: env.py builds it from the DB_* env
# vars via common.settings, so the connection string has exactly one source.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
